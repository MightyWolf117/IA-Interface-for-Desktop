name: 🚀 Build & Release CYBER-IA Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '¿Publicar como borrador (Draft)?'
        required: true
        type: boolean
        default: false
      prerelease:
        description: '¿Marcar como versión preliminar (Prerelease)?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: 📦 Compilar Instalador (Windows x64)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 📦 Instalar Dependencias de Backend y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: ⚙️ Compilar API FastAPI a Binario Autónomo
        run: |
          python backend/build_api.py

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'interface/package.json'

      - name: 📦 Instalar Dependencias del Frontend Tauri
        run: |
          cd interface
          npm install

      - name: 🦀 Configurar Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Caché de Compilación Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'interface/src-tauri -> target'

      - name: 🏗️ Compilar Aplicación de Escritorio con Tauri (Binario)
        run: |
          cd interface
          npm run tauri -- build --no-bundle

      - name: 🛠️ Instalar Inno Setup Compiler
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: 📦 Compilar Instalador Oficial con Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\cyber-ia.iss

      - name: 🗜️ Empaquetar Versión Portable (.7z Ultra)
        run: |
          New-Item -ItemType Directory -Force -Path "staging-portable"
          New-Item -ItemType Directory -Force -Path "release-artifacts"
          Copy-Item -Path "interface\src-tauri\target\release\cyber-ia.exe" -Destination "staging-portable\"
          Copy-Item -Path "interface\src-tauri\resources" -Destination "staging-portable\" -Recurse -Force
          Copy-Item -Path "interface\src-tauri\INSTALLER_LICENSE.txt" -Destination "staging-portable\"
          Copy-Item -Path "README.md" -Destination "staging-portable\"
          Copy-Item -Path "LICENSE" -Destination "staging-portable\"
          7z a -t7z -m0=lzma2 -mx=9 -ms=on release-artifacts\CYBER-IA-v1.0.0-Windows-x64-Portable.7z .\staging-portable\*

          # Auditoría de tamaños para verificar cumplimiento de límites de GitHub Releases (< 2 GiB)
          Get-ChildItem -Path "installer\output", "release-artifacts" -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            $sizeGB = [math]::Round($_.Length / 1GB, 3)
            Write-Host "📦 Artefacto generado: $($_.Name) - $sizeMB MB ($sizeGB GB)"
            if ($_.Length -ge 2147483648) {
              Write-Error "ERROR: El archivo $($_.Name) excede el límite de 2 GiB de GitHub Releases ($($_.Length) bytes)"
              exit 1
            }
          }

      - name: 📤 Subir Instaladores como Artefactos de la Ejecución (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-IA-Windows-Release
          path: |
            installer/output/*.exe
            release-artifacts/*.7z
          if-no-files-found: warn

      - name: 🚀 Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'CYBER-IA v1.0.0 // Official Desktop Release'
          body: |
            ## ⚡ CYBER-IA // Instalador Oficial de Escritorio
            
            Versión oficial empaquetada lista para instalar en Windows 10/11 (64-bit).
            
            ### 🌟 Características de esta versión:
            - **Ejecución 100% Autónoma**: No requiere instalar Python, Git, Node.js ni Rust en el equipo del usuario.
            - **Backend FastAPI Integrado**: Empaquetado como dependencia nativa subordinada gestionada por Rust con arranque y apagado automático en segundo plano.
            - **Instalador Oficial Inno Setup 6**: Instalador asistido `.exe` de 64 bits con compresión LZMA2-Ultra, estética Cyberpunk HUD y aceptación obligatoria de licencias y políticas de uso.
            - **Edición Portable (.7z)**: Versión de alta compresión LZMA2 para extracción y uso directo sin instalación.
            
            Consulte [RELEASE_NOTES.md](RELEASE_NOTES.md) y [CHANGELOG.md](CHANGELOG.md) para más detalles técnicos.
          files: |
            installer/output/*.exe
            release-artifacts/*.7z
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
