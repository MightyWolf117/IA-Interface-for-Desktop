name: 🚀 Build & Release CYBER-IA Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '¿Publicar como borrador (Draft)?'
        required: true
        type: boolean
        default: false
      prerelease:
        description: '¿Marcar como versión preliminar (Prerelease)?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: 📦 Compilar Instalador (Windows x64)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 📦 Instalar Dependencias de Backend y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: ⚙️ Compilar API FastAPI a Binario Autónomo
        run: |
          python backend/build_api.py

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'interface/package.json'

      - name: 📦 Instalar Dependencias del Frontend Tauri
        run: |
          cd interface
          npm install

      - name: 🦀 Configurar Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Caché de Compilación Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'interface/src-tauri -> target'

      - name: 🏗️ Compilar Aplicación de Escritorio con Tauri
        id: build-tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: interface
          tagName: ${{ github.ref_name }}
          releaseName: 'CYBER-IA v__VERSION__'
          releaseBody: |
            ## ⚡ CYBER-IA // Instalador Oficial de Escritorio
            
            Versión oficial empaquetada lista para instalar en Windows 10/11 (64-bit).
            
            ### 🌟 Características de esta versión:
            - **Ejecución 100% Autónoma**: No requiere instalar Python, Git, Node.js ni Rust en el equipo del usuario.
            - **Backend FastAPI Integrado**: Empaquetado como dependencia nativa gestionada por Rust con arranque y apagado automático en segundo plano.
            - **Instalador Oficial**: Instalador asistido `.exe` (NSIS) con estética Cyberpunk HUD y aceptación obligatoria de licencias.
            
            Consulte [RELEASE_NOTES.md](RELEASE_NOTES.md) y [CHANGELOG.md](CHANGELOG.md) para más detalles técnicos.
          releaseDraft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}

      - name: 📤 Subir Instaladores como Artefactos de la Ejecución (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-IA-Windows-Installer
          path: interface/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
