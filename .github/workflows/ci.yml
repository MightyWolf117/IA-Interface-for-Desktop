name: 🔍 Integración Continua (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-system:
    name: 🧪 Validación de Backend y Frontend
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 📦 Instalar Dependencias de Backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: 🔎 Verificación de Sintaxis Python (PEP8)
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'interface/package.json'

      - name: 📦 Instalar Dependencias de Frontend
        run: |
          cd interface
          npm install

      - name: 🦀 Configurar Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'interface/src-tauri -> target'

      - name: 🦀 Validar Compilación de Rust con Cargo Check
        run: |
          cargo check --manifest-path "interface/src-tauri/Cargo.toml"
